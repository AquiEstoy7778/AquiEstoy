<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'Inter', Arial, sans-serif;
        background: #FFFFFF;
    }

    .lienzo {
        position: relative;
        width: 1200px;
        height: 630px;
        background: linear-gradient(115deg, #FFFFFF 0%, #FFF7F7 48%, #FDEDED 100%);
        overflow: hidden;
    }

    .lienzo::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 10px;
        background: #E12726;
    }

    .halo {
        position: absolute;
        top: -180px;
        right: -120px;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(225, 39, 38, .14) 0%, rgba(225, 39, 38, 0) 68%);
    }

    .texto {
        position: absolute;
        top: 62px;
        left: 64px;
        width: 620px;
    }

    /* Logotipo */
    .logo {
        display: inline-flex;
        align-items: flex-end;
        font-family: 'Poppins', Arial, sans-serif;
        font-weight: 700;
        letter-spacing: -.045em;
        line-height: .92;
        font-size: 54px;
        white-space: nowrap;
    }

    .logo-aqui, .logo-estoy { display: inline-block; }
    .logo-aqui { color: #E12726; }
    .logo-estoy { color: #2F3437; }

    .logo-i { position: relative; display: inline-block; }

    .logo-pin {
        position: absolute;
        left: 50%;
        bottom: calc(100% - .30em);
        width: .68em;
        height: .68em;
        transform: translateX(-50%);
        color: #E12726;
    }

    .lema {
        margin-top: 14px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: .16em;
        text-transform: uppercase;
        color: #6B7280;
    }

    h1 {
        margin-top: 26px;
        font-size: 46px;
        font-weight: 800;
        line-height: 1.12;
        letter-spacing: -.03em;
        color: #2F3437;
    }

    h1 span { color: #E12726; }

    .sub {
        margin-top: 18px;
        font-size: 20px;
        font-weight: 500;
        color: #4B5257;
        line-height: 1.4;
    }

    .tel {
        margin-top: 26px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 19px;
        font-weight: 700;
        color: #2F3437;
    }

    .tel svg { width: 22px; height: 22px; color: #E12726; }

    .arte {
        position: absolute;
        right: 42px;
        top: 50%;
        transform: translateY(-50%);
        width: 500px;
        border-radius: 24px;
        box-shadow: 0 40px 70px -38px rgba(47, 52, 55, .5), 0 0 0 1px rgba(225, 39, 38, .08);
    }
</style>
</head>
<body>
    <div class="lienzo">
        <div class="halo"></div>

        <div class="texto">
            <span class="logo">
                <span class="logo-aqui">Aqu<span class="logo-i">i<svg class="logo-pin" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.3a7.2 7.2 0 0 0-7.2 7.2c0 5.4 7.2 13.1 7.2 13.1s7.2-7.7 7.2-13.1A7.2 7.2 0 0 0 12 2.3Z" fill="currentColor"/><circle cx="12" cy="9.5" r="2.7" fill="#fff"/></svg></span></span><span class="logo-estoy">Estoy</span>
            </span>

            <p class="lema">Presencia en Google Maps</p>

            <h1>Tu negocio, visible donde <span>todos buscan</span>.</h1>

            <p class="sub">Optimización del perfil · Reseñas de 5 estrellas<br>Capacitación de tu equipo</p>

            <p class="tel">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.6-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.06 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.69.25-1.28.17-1.41-.07-.13-.27-.2-.57-.35z"/><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38c1.45.79 3.08 1.21 4.79 1.21 5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2zm0 18.13c-1.53 0-3.03-.41-4.34-1.19l-.31-.18-3.12.82.83-3.04-.2-.32a8.19 8.19 0 0 1-1.26-4.37c0-4.54 3.7-8.24 8.25-8.24 4.54 0 8.24 3.7 8.24 8.24 0 4.55-3.7 8.24-8.24 8.24z"/></svg>
                +58 412-4090996
            </p>
        </div>

        <img class="arte" src="../assets/hero-google-maps.svg" alt="">
    </div>
</body>
</html>
