      <rect x="344" y="322" width="9" height="9" rx="1.5"/>
    </g>

    <!-- Acentos azules dentro del QR -->
    <g fill="#E12726">
      <rect x="250" y="170" width="9" height="9" rx="1.5"/>
      <rect x="186" y="252" width="9" height="9" rx="1.5"/>
      <rect x="270" y="322" width="9" height="9" rx="1.5"/>
    </g>
