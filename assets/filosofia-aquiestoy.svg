  <!-- Pin flotante -->
  <g filter="url(#sombraPinSobre)">
    <path d="M392 62c-23 0-41.5 18-41.5 40.4C350.5 131 392 170 392 170s41.5-39 41.5-67.6C433.5 80 415 62 392 62Z" fill="#E12726"/>
  </g>
  <circle cx="392" cy="103" r="14" fill="#FFFFFF"/>
  <circle cx="392" cy="103" r="6" fill="#E12726"/>

