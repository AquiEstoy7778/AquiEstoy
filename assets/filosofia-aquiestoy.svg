<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500" role="img" aria-labelledby="tituloSobre">
  <title id="tituloSobre">World: ecosistema físico-digital para negocios locales</title>

  <defs>
    <linearGradient id="bgSobre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F3437"/>
      <stop offset="1" stop-color="#1F2426"/>
    </linearGradient>
    <radialGradient id="luzSobre" cx="0.28" cy="0.2" r="0.85">
      <stop offset="0" stop-color="#E12726" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E12726" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombraSobre" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="sombraPinSobre" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#E12726" flood-opacity="0.55"/>
    </filter>
    <filter id="sombraChipSobre" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="500" height="500" rx="24" fill="url(#bgSobre)"/>
  <rect width="500" height="500" rx="24" fill="url(#luzSobre)"/>

  <!-- Anillos decorativos -->
  <g fill="none" stroke="#F26B5E" stroke-opacity="0.28">
    <circle cx="250" cy="250" r="152" stroke-width="1.5"/>
    <circle cx="250" cy="250" r="204" stroke-width="1.5" stroke-dasharray="5 11"/>
  </g>

  <!-- Tarjeta QR -->
  <g transform="rotate(-7 250 250)" filter="url(#sombraSobre)">
    <rect x="120" y="120" width="260" height="260" rx="24" fill="#FFFFFF"/>
  </g>

