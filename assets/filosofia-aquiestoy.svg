      <rect x="286" y="232" width="9" height="9" rx="1.5"/>
      <rect x="314" y="232" width="9" height="9" rx="1.5"/>
      <rect x="338" y="232" width="9" height="9" rx="1.5"/>
      <rect x="150" y="252" width="9" height="9" rx="1.5"/>
      <rect x="182" y="252" width="9" height="9" rx="1.5"/>
      <rect x="212" y="252" width="9" height="9" rx="1.5"/>
      <rect x="242" y="252" width="9" height="9" rx="1.5"/>
      <rect x="272" y="252" width="9" height="9" rx="1.5"/>
      <rect x="302" y="252" width="9" height="9" rx="1.5"/>
      <rect x="332" y="252" width="9" height="9" rx="1.5"/>
      <rect x="178" y="272" width="9" height="9" rx="1.5"/>
      <rect x="212" y="272" width="9" height="9" rx="1.5"/>
      <rect x="246" y="272" width="9" height="9" rx="1.5"/>
      <rect x="280" y="272" width="9" height="9" rx="1.5"/>
      <rect x="314" y="272" width="9" height="9" rx="1.5"/>
      <rect x="214" y="298" width="9" height="9" rx="1.5"/>
      <rect x="242" y="298" width="9" height="9" rx="1.5"/>
