        <rect x="159" y="159" width="34" height="34" rx="4" fill="#FFFFFF"/>
        <rect x="169" y="169" width="14" height="14" rx="2"/>
      </g>
      <g>
        <rect x="298" y="150" width="52" height="52" rx="7"/>
        <rect x="307" y="159" width="34" height="34" rx="4" fill="#FFFFFF"/>
        <rect x="317" y="169" width="14" height="14" rx="2"/>
