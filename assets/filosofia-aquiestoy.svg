    <g transform="translate(150 376) scale(0.68)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
