<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450" role="img" aria-labelledby="tituloHero">
  <title id="tituloHero">Perfil de negocio optimizado en Google Maps con reseñas de cinco estrellas</title>

  <defs>
    <linearGradient id="fondoHero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDF3F3"/>
      <stop offset="1" stop-color="#FBDCDC"/>
    </linearGradient>
    <linearGradient id="pinHero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F26B5E"/>
      <stop offset="1" stop-color="#E12726"/>
    </linearGradient>
    <filter id="sombraHero" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2F3437" flood-opacity="0.14"/>
    </filter>
    <filter id="sombraPin" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#E12726" flood-opacity="0.35"/>
    </filter>
    <filter id="sombraChip" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#2F3437" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="600" height="450" rx="24" fill="url(#fondoHero)"/>

  <!-- Calles del mapa -->
  <g fill="none" stroke="#F2C4C1" stroke-width="13" stroke-linecap="round" opacity="0.85">
    <path d="M-30 336 C 90 302 152 382 286 342 S 476 282 640 322"/>
    <path d="M118 -20 C 150 88 92 152 148 262 S 118 424 188 480"/>
  </g>
  <g fill="#EBA29E" opacity="0.75">
    <circle cx="66" cy="118" r="5"/>
    <circle cx="528" cy="152" r="5"/>
    <circle cx="54" cy="252" r="4"/>
    <circle cx="548" cy="336" r="4"/>
    <circle cx="470" cy="416" r="4"/>
  </g>

  <!-- Tarjeta del perfil de negocio -->
  <g filter="url(#sombraHero)">
    <rect x="60" y="72" width="480" height="306" rx="20" fill="#FFFFFF"/>
  </g>

  <!-- Foto del local -->
  <rect x="84" y="96" width="180" height="150" rx="12" fill="#E5E7EB"/>
  <circle cx="234" cy="116" r="11" fill="#FCD34D"/>
  <rect x="104" y="132" width="140" height="18" rx="6" fill="#E12726"/>
  <rect x="112" y="146" width="124" height="84" rx="5" fill="#D3D7DA"/>
  <rect x="152" y="182" width="32" height="48" rx="3" fill="#6B7280"/>
  <rect x="124" y="182" width="20" height="22" rx="2" fill="#F7F8F9"/>
  <rect x="204" y="182" width="20" height="22" rx="2" fill="#F7F8F9"/>

  <!-- Nombre y datos -->
  <rect x="284" y="106" width="196" height="17" rx="8" fill="#2F3437"/>
  <rect x="284" y="134" width="132" height="10" rx="5" fill="#A6ACB2"/>

  <!-- Estrellas -->
  <g fill="#F59E0B">
    <g transform="translate(292 166)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
    <g transform="translate(314 166)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
    <g transform="translate(336 166)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
    <g transform="translate(358 166)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
    <g transform="translate(380 166)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
  </g>
  <text x="398" y="171" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="700" fill="#2F3437">4.9</text>
  <text x="424" y="171" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="500" fill="#6B7280">(128)</text>

  <!-- Botones -->
  <rect x="284" y="194" width="104" height="34" rx="17" fill="#FDF3F3" stroke="#F2C4C1"/>
  <text x="336" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#BE1B1A">Ver reseñas</text>

  <rect x="398" y="194" width="118" height="34" rx="17" fill="#E12726"/>
  <text x="457" y="216" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#FFFFFF">Cómo llegar</text>

  <!-- Separador -->
  <line x1="84" y1="256" x2="516" y2="256" stroke="#E5E7EB" stroke-width="1.5"/>

  <!-- Miniaturas -->
  <rect x="84" y="272" width="92" height="84" rx="10" fill="#FBDCDC"/>
  <rect x="186" y="272" width="92" height="84" rx="10" fill="#FDF3F3"/>
  <rect x="288" y="272" width="92" height="84" rx="10" fill="#FBDCDC"/>
  <g fill="#EBA29E" opacity="0.85">
    <circle cx="130" cy="308" r="14"/>
    <path d="M130 296a12 12 0 0 1 12 12v26h-24v-26a12 12 0 0 1 12-12Z" opacity="0"/>
  </g>
  <g fill="#F2C4C1">
    <rect x="104" y="292" width="52" height="44" rx="6"/>
    <rect x="206" y="300" width="52" height="30" rx="6"/>
    <rect x="308" y="288" width="52" height="52" rx="6"/>
  </g>
  <circle cx="332" cy="314" r="11" fill="#E12726"/>
  <circle cx="332" cy="314" r="4" fill="#FFFFFF"/>

  <!-- Comentario destacado -->
  <rect x="392" y="272" width="124" height="10" rx="5" fill="#2F3437"/>
  <g fill="#F59E0B">
    <g transform="translate(396 296) scale(0.8)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
    <g transform="translate(412 296) scale(0.8)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
    <g transform="translate(428 296) scale(0.8)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
    <g transform="translate(444 296) scale(0.8)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
    <g transform="translate(460 296) scale(0.8)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
  </g>
  <rect x="392" y="314" width="124" height="8" rx="4" fill="#D3D7DA"/>
  <rect x="392" y="330" width="100" height="8" rx="4" fill="#D3D7DA"/>
  <rect x="392" y="346" width="112" height="8" rx="4" fill="#E5E7EB"/>

  <!-- Pin flotante -->
  <g filter="url(#sombraPin)">
    <path d="M528 44c-15.5 0-28 12.2-28 27.3C500 91 528 112 528 112s28-21 28-40.7C556 56.2 543.5 44 528 44Z" fill="url(#pinHero)"/>
  </g>
  <circle cx="528" cy="72" r="9.5" fill="#FFFFFF"/>

  <!-- Chip de reseñas nuevas -->
  <g filter="url(#sombraChip)">
    <rect x="26" y="322" width="128" height="58" rx="14" fill="#FFFFFF"/>
  </g>
  <g fill="#F59E0B">
    <g transform="translate(44 340) scale(0.62)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
    <g transform="translate(57 340) scale(0.62)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
    <g transform="translate(70 340) scale(0.62)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
    <g transform="translate(83 340) scale(0.62)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
    <g transform="translate(96 340) scale(0.62)"><path d="M0-7 2.1-2.2 7.3-1.5 3.4 1.7 4.5 6.9 0 4.1-4.5 6.9-3.4 1.7-7.3-1.5-2.1-2.2Z"/></g>
  </g>
  <text x="44" y="368" font-family="Inter, Arial, sans-serif" font-size="11" font-weight="600" fill="#4B5257">+12 reseñas hoy</text>
</svg>
